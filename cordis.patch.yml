# dsh-mcp-native bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process and serves the /mcp-native routes that read and rewrite the
# profile's MCP loader rows, and the `dsh.client` declaration in package.json
# makes the browser half (exports "./client", served at /plugins/<id>/client.js)
# load in the web GUI, where it registers the Settings section.
- insert:
    - id: mcp-native
      name: 'dsh-mcp-native'
