name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step: the plugin has zero runtime dependencies and ships its
      # own plain-JS halves, so a fresh checkout is already runnable.
      - name: Host half — loader integration (50 checks)
        run: node test/host.test.mjs

      - name: Browser half — bundle contract (21 checks)
        run: node test/client.test.mjs

      - name: Every shipped module parses
        run: for file in lib/*.js; do node --check "$file"; done

      - name: npm tarball carries both halves and the bundle patch
        run: |
          npm pack --pack-destination . > /dev/null
          tarball="$(ls dsh-mcp-native-*.tgz)"
          # List to a file, never through a pipe: `grep -q` exits on the first
          # match and would close the pipe under tar, tripping `set -o pipefail`.
          listing="$(mktemp)"
          tar -tzf "$tarball" > "$listing"
          echo "--- $tarball ---"
          sort "$listing"
          for expected in \
            package/lib/index.js \
            package/lib/client.js \
            package/cordis.patch.yml \
            package/package.json
          do
            grep -qx "$expected" "$listing"
          done
